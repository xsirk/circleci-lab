version: 2.1

commands:
  install-deps:
    steps:
      - restore_cache:
          keys:
            - pip-v1-{{ checksum "requirements.txt" }}
            - pip-v1-
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - save_cache:
          key: pip-v1-{{ checksum "requirements.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - install-deps
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            pytest -v --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

  lint:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - install-deps
      - run:
          name: Check formatting (black)
          command: black --check .

workflows:
  build-and-test:
    jobs:
      - test
      - lint
